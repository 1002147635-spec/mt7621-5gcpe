name: Build MyCPE 5G Firmware

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenWrt 标签/分支'
        required: true
        default: 'v23.05.5'

  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: 取本仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libncursesw5-dev libssl-dev \
            python3-setuptools python3-dev rsync swig unzip zlib1g-dev file wget \
            libelf-dev ecj fastjar java-propose-classpath subversion \
            device-tree-compiler

      - name: 拉取 OpenWrt 源码
        env:
          OWRT_VERSION: ${{ github.event.inputs.version || 'v23.05.5' }}
        run: |
          git clone --depth 1 -b "$OWRT_VERSION" \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git log -1 --pretty='%H %s' | tee ../BUILD_BASE.txt

      - name: 注入板级支持
        run: |
          python3 ./scripts/apply-board.py openwrt

      - name: 配置 feeds（官方必须成功，第三方失败可容忍）
        run: |
          cd openwrt
          # 1) 先只更新官方 feed，这一步失败说明源码或网络有问题，应当直接红
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 2) 再单独尝试第三方 qmodem feed。仓库改名/删库/网络抖动都不许拖垮整条流水线，
          #    拉不到就退化成 uqmi + 自研 watchdog，功能弱一点但固件照样能出。
          if grep -q '^src-git modem ' feeds.conf.default; then
            echo "qmodem feed 已在 feeds.conf.default 中"
          else
            cat ../configs/feeds.conf.append >> feeds.conf.default
          fi
          if ./scripts/feeds update modem; then
            ./scripts/feeds install -a -p modem \
              || echo "::warning::modem feed 安装失败，luci-app-qmodem 将被跳过"
          else
            echo "::warning::modem feed 拉取失败，跳过 qmodem，改用 uqmi 方案"
            # 把失败的 feed 行注释掉，否则后续 defconfig 会因 feed 索引缺失报错
            sed -i 's|^src-git modem |#src-git modem |' feeds.conf.default
            ./scripts/feeds update -i || true
          fi

      - name: 生成 .config
        run: |
          cd openwrt
          cat ../configs/seed.config >> .config
          make defconfig
          grep -q 'CONFIG_TARGET_ramips_mt7621_DEVICE_mycpe_5gcpe=y' .config \
            || { echo "::error::设备没进 .config，板级注入失败"; exit 1; }
          echo "当前设备："; grep -E 'DEVICE_mycpe|PACKAGE_luci-app-qmodem=' .config

      - name: 缓存下载目录
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ github.event.inputs.version || 'v23.05.5' }}-${{ github.run_id }}
          restore-keys: |
            dl-${{ github.event.inputs.version || 'v23.05.5' }}-

      - name: 预下载软件包
        run: |
          cd openwrt
          make download -j8 || true
          find dl -size -1024c -type f -delete || true

      - name: 编译
        run: |
          cd openwrt
          make -j"$(nproc)" || make -j1 V=s

      - name: 整理产物
        run: |
          mkdir -p out
          find openwrt/bin/targets/ramips/mt7621 -maxdepth 1 -type f \
            \( -name '*.bin' -o -name '*.img' -o -name '*.itb' -o -name 'sha256sums' \) \
            -exec cp -v {} out/ \;
          cp BUILD_BASE.txt out/ 2>/dev/null || true
          ( cd out && sha256sum * > SHA256SUMS.txt )
          ls -lh out

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: mycpe-5gcpe-ramips-mt7621
          path: out/
          if-no-files-found: error
          retention-days: 30
